# product/nginx.conf — gzip + cache đúng cho game single-file.
server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/html application/javascript application/json image/png;
  gzip_min_length 1024;

  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /version.json { add_header Cache-Control "no-cache"; }
  location ~* \.(png|webmanifest)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header X-Content-Type-Options "nosniff";
  }
}
